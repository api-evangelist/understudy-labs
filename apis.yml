apis:
- aid: understudy-labs:understudy-gateway-api
  name: Understudy Gateway API
  description: >-
    Anthropic- and OpenAI-compatible LLM proxy at api.understudylabs.com. POST /v1/messages (Anthropic
    Messages), POST /v1/chat/completions (OpenAI Chat Completions), POST /v1/messages/count_tokens, GET
    /v1/models (public managed-model catalog), and GET /healthz. Supports bring-your-own-key passthrough
    and managed catalog models, capture of request/response evidence, canary routing with fallback, and
    x-understudy-* scoping, tagging, and legibility headers.
  humanURL: https://docs.understudylabs.com/reference/proxy-endpoints
  baseURL: https://api.understudylabs.com
  tags:
  - LLM Gateway
  - Proxy
  - Model Routing
  properties:
  - type: Documentation
    url: https://docs.understudylabs.com/reference/proxy-endpoints
  - type: APIReference
    url: https://docs.understudylabs.com/reference/request-headers
- aid: understudy-labs:understudy-control-plane-api
  name: Understudy Control Plane API
  description: >-
    REST surface behind the dashboard and CLI, served from the gateway host under /admin/v1 and /customer/v1,
    org-scoped and authenticated with sk_* bearer keys. Covers API key mint/list/revoke, project CRUD
    by slug, workload CRUD, the model catalog, route writes with traffic percentages, capture listing
    and envelope fetch, evaluation capture catalogs with frozen cohorts and audited short-lived exports,
    and reporting endpoints for routing status, provider health, workload status, and usage summaries.
  humanURL: https://docs.understudylabs.com/reference/control-plane
  baseURL: https://api.understudylabs.com
  tags:
  - Control Plane
  - APIKeys
  - Routing
  - Evaluations
