aid: understudy-labs
name: Understudy Labs
description: Understudy Labs (YC S26) is an LLM gateway and model-optimization platform that
  helps teams move repeated production LLM workloads onto open-weight models they own. The Understudy
  gateway is a drop-in replacement for the Anthropic and OpenAI API endpoints that captures
  request/response traces by project and workload, routes measured slices of traffic to managed
  open models, and falls back safely. A REST control plane manages keys, projects, workloads,
  routing, captures, evaluation cohorts, and reporting, while the MIT-licensed understudy-agent-tools
  repo ships a CLI, a coding-agent skill library, a local MCP server, and Understudy Desktop
  with a documented loopback OpenAPI 3.1 contract.
