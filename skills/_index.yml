skills:
- name: capture-evidence
  source: https://github.com/understudylabs/understudy-agent-tools/blob/main/skills/capture-evidence/SKILL.md
  description: Use when a developer wants to build an eval from their real LLM app before changing
    anything — "measure how my app is doing today", "build an eval from my workload", "we have
    no baseline", "is my current model actually good". Turns the workload into auditable local
    artifacts (harness, metric, frozen splits, baseline); has a public-benchmark on-ramp when
    no traces exist.
- name: check-routing-health
  source: https://github.com/understudylabs/understudy-agent-tools/blob/main/skills/check-routing-health/SKILL.md
  description: Use when a developer asks "is Understudy causing my errors", "which workloads
    are routed", "is my routing config actually taking effect", "is my provider healthy", "are
    there 500s on staging", "what's our error rate", "where is my gateway spend going", or wants
    self-service diagnostics without asking the team. Reads the hosted reporting endpoints with
    the developer's sk_* key.
- name: compare-model-sweep
  source: https://github.com/understudylabs/understudy-agent-tools/blob/main/skills/compare-model-sweep/SKILL.md
  description: Use when a developer wants to compare candidate models — any mix of local, gateway,
    or frontier — on the same eval and see quality, latency, cost, and reliability side by side.
    "Which model should I use", "sweep these models on my benchmark", "compare Gemma vs the
    frontier on my eval". To stand up and serve a local candidate first, use run-local-model-lab.
- name: compare-trajectories
  source: https://github.com/understudylabs/understudy-agent-tools/blob/main/skills/compare-trajectories/SKILL.md
  description: Use when you need to know HOW two model runs differ behaviorally on the same
    tasks, not just THAT one scores higher — per-task trajectory diffing that classifies the
    gap as persistence/recovery, knowledge, or format/parsing. "why does the bigger model pass
    these", "is this gap RL-shaped", "diff these two trajectory runs", "where do the trajectories
    diverge", "what would distillation buy me". The behavioral complement to compare-model-sweep.
- name: curate-trajectories
  source: https://github.com/understudylabs/understudy-agent-tools/blob/main/skills/curate-trajectories/SKILL.md
  description: Use to turn loose per-task trajectory JSONs (a Lilac export or local rollout
    corpus) into a queryable, provenance-tracked, contamination-safe dataset that hard-blocks
    any selection leaking frozen dev/holdout into a train/RL/distill pool. "curate my trajectories",
    "which rollouts are train-safe", "exclude the holdout rows before RL", "is this distill
    pool contaminated", "make a hash-stamped selection", "stop hand-filtering trajectories in
    bash".
- name: design-simulated-environment
  source: https://github.com/understudylabs/understudy-agent-tools/blob/main/skills/design-simulated-environment/SKILL.md
  description: Use to build a simulated, seeded environment (AutomationBench / verifiers style)
    so any model can run a captured agentic workload end-to-end and be scored on final state
    — "simulate this workload's tools", "build a validator for these traces", "let a small model
    attempt the whole task", "score recall/precision against gold", or any handoff from understand-workload
    toward whole-case model comparison.
- name: distill-classifier
  source: https://github.com/understudylabs/understudy-agent-tools/blob/main/skills/distill-classifier/SKILL.md
  description: Use when a developer wants to replace an expensive frontier model on a classification
    workload (binary, multi-class, multi-label, or structured extraction) with a fine-tuned
    open-weight student — "distill this classifier", "can a small model do this tagging job",
    "the frontier labels these for $X, make it cheaper", "consensus-label my data". Multi-teacher
    majority-vote labeling, failure-directed SFT data, and a four-way promote/shadow/collect/stop
    verdict.
- name: ingest-traces
  source: https://github.com/understudylabs/understudy-agent-tools/blob/main/skills/ingest-traces/SKILL.md
  description: Use when a developer already has production LLM traces — a bucket of captures,
    provider log exports, or gateway capture files — and wants them turned into local, redacted
    eval sets, or profiled for cost first. "Ingest my traces", "turn these logs into an eval
    set", "where is my LLM spend going", "which calls could a local model take over".
- name: inspect-billing-sources
  source: https://github.com/understudylabs/understudy-agent-tools/blob/main/skills/inspect-billing-sources/SKILL.md
  description: ''
- name: install-agent-adapter
  source: https://github.com/understudylabs/understudy-agent-tools/blob/main/skills/install-agent-adapter/SKILL.md
  description: Use when a developer wants to install, enable, update, reinstall, remove, or
    verify Understudy in a coding agent - "install Understudy", "add the Understudy skills",
    "make Claude/Cursor/Codex/OpenCode/Hermes/Devin see the skills". Chooses the requested agent
    platform and routes to the local install, reload, onboarding, and uninstall steps.
- name: install-codex-plugin
  source: https://github.com/understudylabs/understudy-agent-tools/blob/main/skills/install-codex-plugin/SKILL.md
  description: Compatibility shim for Codex installs. Use when a developer asks to install,
    update, enable, reinstall, remove, or verify the Understudy Codex plugin - "install Understudy
    in Codex", "add the Codex plugin", "make Codex see the skills". Route to install-agent-adapter
    with platform codex.
- name: install-cursor-plugin
  source: https://github.com/understudylabs/understudy-agent-tools/blob/main/skills/install-cursor-plugin/SKILL.md
  description: Compatibility shim for Cursor installs. Use when a developer asks to install,
    update, enable, reinstall, remove, or verify the Understudy Cursor plugin - "install Understudy
