entities:
- name: organization
  domain: control-plane
  notes: Root tenant; every control-plane route nests under /orgs/:org_id and
    every sk_* key belongs to one org.
- name: api_key
  domain: control-plane
  notes: sk_live_* credential; metadata carries id, name, obfuscated_value,
    created_at, last_used_at. Plaintext shown once at creation.
- name: project
  domain: control-plane
  notes: Addressed by immutable org-unique slug (x-understudy-project header);
    name is display-only; deletion is soft and frees the slug. Default project
    is rehearsal.
- name: workload
  domain: control-plane
  notes: Named per-project traffic bucket (x-understudy-workload header; default
    main). Carries capture_enabled, capture_sample_rate, route_model_id,
    route_traffic_pct, is_default. Exactly one default per project.
- name: model (catalog)
  domain: control-plane
  notes: Public catalog id (e.g. glm-5.1) with display_name and active flag; the
    same ids GET /v1/models returns. Provider deployments never exposed.
- name: capture
  domain: control-plane
  notes: Request/response evidence envelope named by UUIDv7 request_id; storage
    key encodes org/project/key/date partition. Attributed to the sending
    api_key.
- name: eval_cohort
  domain: control-plane
  notes: Immutable frozen set of 1-500 exact capture references with
    server-computed cohort SHA-256; exports are short-lived and audited.
- name: eval_spec / eval_run
  domain: control-plane
  notes: Immutable eval definitions and compact run summaries tied to a workload
    and cohort.
